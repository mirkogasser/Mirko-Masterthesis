<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Testumgebung Pruefverhalten</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

/* ================== KONFIGURATION ==================
   Hier die eigenen Supabase Werte eintragen, aus
   Project Settings > API im Supabase Dashboard.
   =================================================== */
const SUPABASE_URL = "https://slvbiudctqptvfwirzji.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsdmJpdWRjdHFwdHZmd2lyemppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3ODMyMzgsImV4cCI6MjEwNDM1OTIzOH0.cIKXtYk9l8liewp8sKHvQyOrtML72E5qHjrZxdsfsrw";

const supabaseReady =
  SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 10;
const supabaseClient = supabaseReady
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

/* ================== Farben und Basiswerte ================== */
const COLORS = {
  bg: "#F5F6F7",
  panel: "#FFFFFF",
  text: "#1C2126",
  textSoft: "#5B6470",
  border: "#DADFE3",
  accent: "#33546B",
  accentSoft: "#EFF3F5",
  success: "#4B7A62",
  danger: "#A13D3D",
  bubble: "#DCEAFB",
  link: "#2F6FBB",
};
const PANEL_STYLE = {
  backgroundColor: COLORS.panel,
  border: "1px solid " + COLORS.border,
  borderRadius: "6px",
};
const TASK = {
  assistentName: "Nordlicht Assistent",
  frage: "Wie lange ist die Kuendigungsfrist in der Probezeit?",
  antwort:
    "Laut Personalreglement betraegt die Kuendigungsfrist waehrend der Probezeit zwei Wochen.",
  quelleTitel: "Personalreglement, Abschnitt 4, Auszug",
  quelleText:
    "Waehrend der Probezeit gilt fuer beide Vertragsparteien eine verkuerzte Kuendigungsfrist. Kuendigungen sind schriftlich einzureichen und werden mit dem Datum des Posteingangs wirksam. Die regulaere Kuendigungsfrist nach Ablauf der Probezeit richtet sich nach der Anstellungsdauer und ist in Abschnitt 5 geregelt. Offene Feriensaldi werden unabhaengig von der Kuendigungsfrist gemaess Abschnitt 7 abgegolten.",
};
const STEPS = ["seite1", "experiment", "seite2"];

function uuid() {
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0;
    const v = c === "x" ? r : (r & 0x3) | 0x8;
    return v.toString(16);
  });
}

/* ================== Kleine Icons, ohne externe Bibliothek ================== */
function Icon({ children, size = 16 }) {
  return (
    <svg
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
    >
      {children}
    </svg>
  );
}
const IconArrowUp = (p) => <Icon {...p}><path d="M12 19V5M5 12l7-7 7 7" /></Icon>;
const IconSquare = (p) => <Icon {...p}><rect x="6" y="6" width="12" height="12" rx="2" /></Icon>;
const IconPlus = (p) => <Icon {...p}><path d="M12 5v14M5 12h14" /></Icon>;
const IconMic = (p) => (
  <Icon {...p}>
    <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z" />
    <path d="M19 11a7 7 0 0 1-14 0" />
    <path d="M12 19v3" />
  </Icon>
);
const IconX = (p) => <Icon {...p}><path d="M18 6 6 18M6 6l12 12" /></Icon>;
const IconCopy = (p) => (
  <Icon {...p}>
    <rect x="9" y="9" width="11" height="11" rx="2" />
    <path d="M5 15V5a2 2 0 0 1 2-2h10" />
  </Icon>
);
const IconCheck = (p) => <Icon {...p}><path d="M20 6 9 17l-5-5" /></Icon>;
const IconShare = (p) => (
  <Icon {...p}>
    <path d="M12 3v12" />
    <path d="M7 8l5-5 5 5" />
    <path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" />
  </Icon>
);
const IconRefresh = (p) => (
  <Icon {...p}>
    <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
    <path d="M21 3v5h-5" />
    <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
    <path d="M3 21v-5h5" />
  </Icon>
);
const IconDots = (p) => (
  <Icon {...p}>
    <circle cx="5" cy="12" r="1.5" />
    <circle cx="12" cy="12" r="1.5" />
    <circle cx="19" cy="12" r="1.5" />
  </Icon>
);
const IconExternal = (p) => (
  <Icon {...p}>
    <path d="M7 17 17 7" />
    <path d="M8 7h9v9" />
  </Icon>
);

/* ================== Wiederverwendbare Bausteine ================== */
function ProgressDots({ stepIndex }) {
  if (stepIndex < 0) return null;
  return (
    <div className="flex items-center gap-2 mb-6">
      {STEPS.map((s, i) => (
        <div
          key={s}
          style={{
            height: "4px",
            flex: 1,
            borderRadius: "2px",
            backgroundColor: i <= stepIndex ? COLORS.accent : COLORS.border,
          }}
        />
      ))}
    </div>
  );
}

function Field({ label, children }) {
  return (
    <div className="mb-6">
      <div className="mb-2 text-sm font-medium" style={{ color: COLORS.text }}>
        {label}
      </div>
      {children}
    </div>
  );
}

function RadioGroup({ options, value, onChange }) {
  return (
    <div className="flex flex-col gap-2">
      {options.map((opt) => (
        <button
          key={opt}
          onClick={() => onChange(opt)}
          className="text-left px-4 py-3 text-sm"
          style={{
            ...PANEL_STYLE,
            borderColor: value === opt ? COLORS.accent : COLORS.border,
            backgroundColor: value === opt ? COLORS.accentSoft : COLORS.panel,
            cursor: "pointer",
          }}
        >
          {opt}
        </button>
      ))}
    </div>
  );
}

function PrimaryButton({ children, onClick, disabled }) {
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      className="px-5 py-2.5 text-sm font-medium"
      style={{
        backgroundColor: disabled ? COLORS.border : COLORS.accent,
        color: "#FFFFFF",
        borderRadius: "6px",
        cursor: disabled ? "default" : "pointer",
      }}
    >
      {children}
    </button>
  );
}

function IconButton({ icon, onClick, active }) {
  return (
    <button
      onClick={onClick}
      className="p-1.5"
      style={{
        color: active ? COLORS.success : COLORS.textSoft,
        backgroundColor: "transparent",
        border: "none",
        borderRadius: "4px",
        cursor: "pointer",
        display: "inline-flex",
      }}
    >
      {icon}
    </button>
  );
}

/* Admin Ansicht, bewusst schlicht gehalten, keine Animationen */
function AdminView({ responses, loading, error, onReload, onDownload }) {
  return (
    <div className="mt-8">
      <div className="flex items-center gap-3 mb-4">
        <h3 className="text-sm font-semibold">
          Gespeicherte Antworten, {responses.length}
        </h3>
        <button onClick={onReload} className="text-xs underline" style={{ color: COLORS.accent }}>
          Neu laden
        </button>
        <button onClick={onDownload} className="text-xs underline" style={{ color: COLORS.accent }}>
          Als CSV herunterladen
        </button>
      </div>
      {loading && <p className="text-xs" style={{ color: COLORS.textSoft }}>Laedt</p>}
      {error && <p className="text-xs" style={{ color: COLORS.danger }}>{error}</p>}
      {!loading && !error && responses.length === 0 && (
        <p className="text-xs" style={{ color: COLORS.textSoft }}>Noch keine Antworten vorhanden.</p>
      )}
      {!loading && responses.length > 0 && (
        <div className="overflow-x-auto" style={{ ...PANEL_STYLE }}>
          <table className="text-xs w-full">
            <thead>
              <tr style={{ borderBottom: "1px solid " + COLORS.border }}>
                {[
                  "id", "q1", "q2",
                  "seite1_dauer_ms", "exp_dauer_ms",
                  "quelle_geoeffnet", "verweildauer_ms",
                  "antwort", "konfidenz",
                  "seite2_dauer_ms", "q3", "q4",
                ].map((h) => (
                  <th key={h} className="text-left p-2 font-medium">{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {responses.map((r) => (
                <tr key={r.id} style={{ borderBottom: "1px solid " + COLORS.border }}>
                  <td className="p-2">{String(r.id).slice(0, 8)}</td>
                  <td className="p-2">{r.q1}</td>
                  <td className="p-2">{r.q2}</td>
                  <td className="p-2">{r.seite1_duration_ms}</td>
                  <td className="p-2">{r.exp_duration_ms}</td>
                  <td className="p-2">{r.exp_opened ? "ja" : "nein"}</td>
                  <td className="p-2">{r.exp_dwell_ms}</td>
                  <td className="p-2">{r.exp_answer}</td>
                  <td className="p-2">{r.exp_confidence}</td>
                  <td className="p-2">{r.seite2_duration_ms}</td>
                  <td className="p-2">{r.q3}</td>
                  <td className="p-2">{r.q4}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ================== Hauptkomponente ================== */
function PruefverhaltenPrototyp() {
  const [view, setView] = useState("welcome");
  const [participantId] = useState(() => uuid());
  const [startedAt] = useState(() => new Date().toISOString());
  const [stepEnteredAt, setStepEnteredAt] = useState(Date.now());

  useEffect(() => { setStepEnteredAt(Date.now()); }, [view]);

  const [q1, setQ1] = useState("");
  const [q2, setQ2] = useState("");
  const [q3, setQ3] = useState("");
  const [q4, setQ4] = useState("");
  const [seite1DurationMs, setSeite1DurationMs] = useState(null);
  const [expDurationMs, setExpDurationMs] = useState(null);

  const [inputValue, setInputValue] = useState(TASK.frage);
  const [chatState, setChatState] = useState("idle");
  const [visibleLen, setVisibleLen] = useState(0);
  const streamRef = useRef(null);
  const thinkRef = useRef(null);
  const messagesEndRef = useRef(null);
  const [copied, setCopied] = useState(false);

  const [drawerOpen, setDrawerOpen] = useState(false);
  const [sourceOpenedEver, setSourceOpenedEver] = useState(false);
  const [sourceOpenedAt, setSourceOpenedAt] = useState(null);
  const [dwellMs, setDwellMs] = useState(0);

  const [expAnswer, setExpAnswer] = useState("");
  const [expConfidence, setExpConfidence] = useState(3);

  const [saving, setSaving] = useState(false);
  const [saveError, setSaveError] = useState(null);

  const [adminOpen, setAdminOpen] = useState(false);
  const [adminUnlocked, setAdminUnlocked] = useState(false);
  const [adminPass, setAdminPass] = useState("");
  const [responses, setResponses] = useState([]);
  const [loadingAdmin, setLoadingAdmin] = useState(false);
  const [adminError, setAdminError] = useState(null);

  const stepIndex = STEPS.indexOf(view);

  useEffect(() => {
    return () => {
      if (streamRef.current) clearInterval(streamRef.current);
      if (thinkRef.current) clearTimeout(thinkRef.current);
    };
  }, []);

  useEffect(() => {
    if (messagesEndRef.current) messagesEndRef.current.scrollIntoView({ behavior: "smooth" });
  }, [chatState, visibleLen, drawerOpen]);

  function handleSend() {
    if (chatState !== "idle" || !inputValue.trim()) return;
    setChatState("thinking");
    thinkRef.current = setTimeout(() => {
      setChatState("streaming");
      let i = 0;
      const full = TASK.antwort;
      streamRef.current = setInterval(() => {
        i += 3;
        if (i >= full.length) {
          i = full.length;
          clearInterval(streamRef.current);
          setChatState("done");
        }
        setVisibleLen(i);
      }, 18);
    }, 1100);
  }

  function handleComposerKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  }

  function openDrawer() {
    setDrawerOpen(true);
    setSourceOpenedEver(true);
    setSourceOpenedAt(Date.now());
  }
  function closeDrawer() {
    if (sourceOpenedAt) setDwellMs((d) => d + (Date.now() - sourceOpenedAt));
    setSourceOpenedAt(null);
    setDrawerOpen(false);
  }
  function copyAnswer() {
    if (navigator.clipboard) navigator.clipboard.writeText(TASK.antwort).catch(() => {});
    setCopied(true);
    setTimeout(() => setCopied(false), 1200);
  }

  async function submitAll() {
    setSaving(true);
    setSaveError(null);

    if (!supabaseReady) {
      setSaving(false);
      setSaveError(
        "Supabase ist noch nicht konfiguriert. Bitte SUPABASE_URL und SUPABASE_ANON_KEY im Code eintragen."
      );
      return;
    }

    let finalDwell = dwellMs;
    if (drawerOpen && sourceOpenedAt) finalDwell += Date.now() - sourceOpenedAt;
    const seite2DurationMs = Date.now() - stepEnteredAt;

    const payload = {
      id: participantId,
      started_at: startedAt,
      submitted_at: new Date().toISOString(),
      seite1_duration_ms: seite1DurationMs,
      q1,
      q2,
      exp_duration_ms: expDurationMs,
      exp_opened: sourceOpenedEver,
      exp_dwell_ms: finalDwell,
      exp_answer: expAnswer,
      exp_confidence: expConfidence,
      seite2_duration_ms: seite2DurationMs,
      q3,
      q4,
    };

    const { error } = await supabaseClient.from("responses").insert([payload]);
    setSaving(false);
    if (error) {
      setSaveError("Speichern fehlgeschlagen: " + error.message);
    } else {
      setView("danke");
    }
  }

  async function loadAdmin() {
    setLoadingAdmin(true);
    setAdminError(null);
    if (!supabaseReady) {
      setLoadingAdmin(false);
      setAdminError("Supabase ist noch nicht konfiguriert.");
      return;
    }
    const { data, error } = await supabaseClient
      .from("responses")
      .select("*")
      .order("submitted_at", { ascending: false });
    if (error) {
      setAdminError("Laden fehlgeschlagen: " + error.message);
    } else {
      setResponses(data || []);
    }
    setLoadingAdmin(false);
  }

  function downloadCsv() {
    if (responses.length === 0) return;
    const headers = [
      "id", "started_at", "submitted_at",
      "seite1_duration_ms", "q1", "q2",
      "exp_duration_ms", "exp_opened", "exp_dwell_ms", "exp_answer", "exp_confidence",
      "seite2_duration_ms", "q3", "q4",
    ];
    const escape = (v) => '"' + String(v ?? "").replace(/"/g, '""') + '"';
    const rows = responses.map((r) => headers.map((h) => escape(r[h])).join(","));
    const csv = [headers.join(","), ...rows].join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "testdaten.csv";
    a.click();
    URL.revokeObjectURL(url);
  }

  const shell = {
    minHeight: "100%",
    backgroundColor: COLORS.bg,
    color: COLORS.text,
    fontFamily: "ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif",
  };

  if (view === "welcome") {
    return (
      <div style={shell} className="p-6 flex justify-center">
        <div className="w-full max-w-xl py-10">
          <h1 className="text-2xl font-semibold mb-3">Testumgebung Pruefverhalten</h1>
          <p className="text-sm mb-2" style={{ color: COLORS.textSoft }}>
            Diese Version dient dem technischen Test des Ablaufs. Es werden noch keine
            echten Studieninhalte und keine experimentellen Bedingungen verwendet.
          </p>
          <p className="text-sm mb-8" style={{ color: COLORS.textSoft }}>
            Der Ablauf umfasst zwei kurze Frageseiten und eine Beispielaufgabe und dauert
            etwa zwei Minuten.
          </p>
          <PrimaryButton onClick={() => setView("seite1")}>Start</PrimaryButton>
        </div>
      </div>
    );
  }

  if (view === "seite1") {
    return (
      <div style={shell} className="p-6 flex justify-center">
        <div className="w-full max-w-xl py-10">
          <ProgressDots stepIndex={stepIndex} />
          <h2 className="text-lg font-semibold mb-6">Fragen, Teil 1</h2>
          <Field label="Wie haeufig nutzen Sie im Arbeitsalltag KI gestuetzte Werkzeuge?">
            <RadioGroup options={["Taeglich", "Mehrmals pro Woche", "Selten", "Nie"]} value={q1} onChange={setQ1} />
          </Field>
          <Field label="Was verstehen Sie unter dem Begriff Pruefverhalten? Kurze Antwort in eigenen Worten.">
            <textarea
              value={q2}
              onChange={(e) => setQ2(e.target.value)}
              rows={4}
              className="w-full p-3 text-sm"
              style={{ ...PANEL_STYLE, resize: "vertical" }}
              placeholder="Ihre Antwort"
            />
          </Field>
          <PrimaryButton
            onClick={() => {
              setSeite1DurationMs(Date.now() - stepEnteredAt);
              setView("experiment");
            }}
            disabled={!q1 || !q2.trim()}
          >
            Weiter
          </PrimaryButton>
        </div>
      </div>
    );
  }

  if (view === "experiment") {
    const answerText = TASK.antwort.slice(0, visibleLen);
    const isStreamingOrDone = chatState === "streaming" || chatState === "done";
    const isDone = chatState === "done";

    return (
      <div style={shell} className="p-6 flex justify-center">
        <div className="w-full max-w-2xl py-10">
          <ProgressDots stepIndex={stepIndex} />
          <h2 className="text-lg font-semibold mb-2">Beispielaufgabe</h2>
          <p className="text-sm mb-6" style={{ color: COLORS.textSoft }}>
            Stellen Sie sich vor, Sie arbeiten bei der Nordlicht AG, einem fiktiven
            Unternehmen, und stellen dem internen KI Assistenten eine Frage.
          </p>

          <div style={{ ...PANEL_STYLE, height: "420px", display: "flex", flexDirection: "column", overflow: "hidden", position: "relative" }}>
            <div className="px-4 py-3 text-xs font-medium" style={{ borderBottom: "1px solid " + COLORS.border, color: COLORS.textSoft }}>
              {TASK.assistentName}
            </div>

            <div className="flex-1 overflow-y-auto px-5 py-5">
              {chatState !== "idle" && (
                <div className="flex justify-end mb-5">
                  <div className="px-4 py-3 text-sm" style={{ backgroundColor: COLORS.bubble, borderRadius: "18px", maxWidth: "80%" }}>
                    {inputValue}
                  </div>
                </div>
              )}

              {chatState === "thinking" && (
                <div className="text-sm animate-pulse" style={{ color: COLORS.textSoft }}>Denkt nach ...</div>
              )}

              {isStreamingOrDone && (
                <div>
                  <p className="text-sm leading-relaxed" style={{ color: COLORS.text }}>
                    {answerText}
                    {isDone && (
                      <span onClick={openDrawer} className="text-sm inline-flex items-center gap-0.5"
                        style={{ color: COLORS.link, borderBottom: "1px dotted " + COLORS.link, cursor: "pointer" }}>
                        {" "}Quelle <IconExternal size={13} />
                      </span>
                    )}
                  </p>
                  {isDone && (
                    <div className="flex items-center gap-1 mt-3">
                      <IconButton onClick={copyAnswer} active={copied} icon={copied ? <IconCheck size={15} /> : <IconCopy size={15} />} />
                      <IconButton icon={<IconShare size={15} />} />
                      <IconButton icon={<IconRefresh size={15} />} />
                      <IconButton icon={<IconDots size={15} />} />
                    </div>
                  )}
                </div>
              )}
              <div ref={messagesEndRef} />
            </div>

            <div className="px-4 pb-3 pt-2">
              <div className="flex items-end gap-2 px-3 py-2" style={{ border: "1px solid " + COLORS.border, borderRadius: "22px", backgroundColor: COLORS.panel }}>
                <button style={{ color: COLORS.textSoft, background: "none", border: "none", cursor: "default" }} className="p-1">
                  <IconPlus size={18} />
                </button>
                <textarea
                  value={inputValue}
                  onChange={(e) => setInputValue(e.target.value)}
                  onKeyDown={handleComposerKeyDown}
                  disabled={chatState !== "idle"}
                  rows={1}
                  className="flex-1 text-sm resize-none"
                  style={{ border: "none", outline: "none", backgroundColor: "transparent", color: COLORS.text, lineHeight: "1.4", maxHeight: "80px" }}
                  placeholder="Nachricht an den Nordlicht Assistenten"
                />
                <button style={{ color: COLORS.textSoft, background: "none", border: "none", cursor: "default" }} className="p-1">
                  <IconMic size={18} />
                </button>
                <button
                  onClick={handleSend}
                  disabled={chatState !== "idle" || !inputValue.trim()}
                  className="flex items-center justify-center"
                  style={{
                    width: "32px", height: "32px", borderRadius: "50%",
                    backgroundColor: chatState !== "idle" || !inputValue.trim() ? COLORS.border : COLORS.accent,
                    color: "#FFFFFF", border: "none",
                    cursor: chatState === "idle" && inputValue.trim() ? "pointer" : "default",
                  }}
                >
                  {chatState === "idle" ? <IconArrowUp size={16} /> : <IconSquare size={12} />}
                </button>
              </div>
              <p className="text-xs text-center mt-2" style={{ color: COLORS.textSoft }}>
                Der {TASK.assistentName} kann Fehler machen. Ueberpruefen Sie wichtige Informationen.
              </p>
            </div>

            {drawerOpen && (
              <div onClick={closeDrawer} style={{ position: "absolute", inset: 0, backgroundColor: "rgba(28,33,38,0.25)", zIndex: 10 }} />
            )}
            <div
              style={{
                position: "absolute", top: 0, right: 0, height: "100%", width: "78%",
                backgroundColor: COLORS.panel, borderLeft: "1px solid " + COLORS.border,
                boxShadow: "-4px 0 16px rgba(0,0,0,0.08)",
                transform: drawerOpen ? "translateX(0)" : "translateX(100%)",
                transition: "transform 240ms ease", zIndex: 11, display: "flex", flexDirection: "column",
              }}
            >
              <div className="flex items-center justify-between px-4 py-3" style={{ borderBottom: "1px solid " + COLORS.border }}>
                <span className="text-xs font-medium" style={{ color: COLORS.textSoft }}>Quelle</span>
                <button onClick={closeDrawer} style={{ background: "none", border: "none", color: COLORS.textSoft, cursor: "pointer" }}>
                  <IconX size={16} />
                </button>
              </div>
              <div className="px-4 py-4 overflow-y-auto">
                <div className="text-xs font-medium mb-2" style={{ color: COLORS.textSoft }}>{TASK.quelleTitel}</div>
                <p className="text-sm leading-relaxed">{TASK.quelleText}</p>
              </div>
            </div>
          </div>

          {isDone && (
            <div className="mt-6">
              <Field label="Ist diese Aussage korrekt?">
                <RadioGroup options={["Ja", "Nein", "Unsicher"]} value={expAnswer} onChange={setExpAnswer} />
              </Field>
              <Field label={"Wie sicher sind Sie sich? " + expConfidence + " von 5"}>
                <input type="range" min="1" max="5" value={expConfidence}
                  onChange={(e) => setExpConfidence(Number(e.target.value))} className="w-full" />
              </Field>
              <PrimaryButton
                onClick={() => {
                  setExpDurationMs(Date.now() - stepEnteredAt);
                  setView("seite2");
                }}
                disabled={!expAnswer}
              >
                Weiter
              </PrimaryButton>
            </div>
          )}
        </div>
      </div>
    );
  }

  if (view === "seite2") {
    return (
      <div style={shell} className="p-6 flex justify-center">
        <div className="w-full max-w-xl py-10">
          <ProgressDots stepIndex={stepIndex} />
          <h2 className="text-lg font-semibold mb-6">Fragen, Teil 2</h2>
          <Field label="Wie sicher fuehlen Sie sich generell im Umgang mit KI Werkzeugen? 1 gar nicht sicher, 5 sehr sicher">
            <div className="flex gap-2">
              {[1, 2, 3, 4, 5].map((n) => (
                <button key={n} onClick={() => setQ3(String(n))} className="w-10 h-10 text-sm font-medium"
                  style={{ ...PANEL_STYLE, borderColor: q3 === String(n) ? COLORS.accent : COLORS.border, backgroundColor: q3 === String(n) ? COLORS.accentSoft : COLORS.panel, cursor: "pointer" }}>
                  {n}
                </button>
              ))}
            </div>
          </Field>
          <Field label="Gab es beim Ablauf technische Probleme? Falls ja, welche?">
            <textarea value={q4} onChange={(e) => setQ4(e.target.value)} rows={4}
              className="w-full p-3 text-sm" style={{ ...PANEL_STYLE, resize: "vertical" }} placeholder="Ihre Antwort, oder leer lassen" />
          </Field>
          {saveError && <p className="text-sm mb-4" style={{ color: COLORS.danger }}>{saveError}</p>}
          <PrimaryButton onClick={submitAll} disabled={!q3 || saving}>
            {saving ? "Wird gespeichert" : "Antworten abschicken"}
          </PrimaryButton>
        </div>
      </div>
    );
  }

  if (view === "danke") {
    return (
      <div style={shell} className="p-6 flex justify-center">
        <div className="w-full max-w-xl py-10">
          <h2 className="text-lg font-semibold mb-3">Vielen Dank</h2>
          <p className="text-sm mb-8" style={{ color: COLORS.textSoft }}>
            Ihre Antworten wurden gespeichert. Der Test ist damit abgeschlossen.
          </p>
          <button onClick={() => setAdminOpen(true)} className="text-xs underline" style={{ color: COLORS.textSoft }}>
            Admin
          </button>
          {adminOpen && !adminUnlocked && (
            <div className="mt-4 flex gap-2">
              <input type="password" value={adminPass} onChange={(e) => setAdminPass(e.target.value)}
                className="p-2 text-sm" style={{ ...PANEL_STYLE }} placeholder="Passwort" />
              <PrimaryButton onClick={() => {
                if (adminPass === "mirko-test") { setAdminUnlocked(true); loadAdmin(); }
              }}>
                OK
              </PrimaryButton>
            </div>
          )}
          {adminUnlocked && (
            <AdminView responses={responses} loading={loadingAdmin} error={adminError} onReload={loadAdmin} onDownload={downloadCsv} />
          )}
        </div>
      </div>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<PruefverhaltenPrototyp />);
</script>
</body>
</html>
